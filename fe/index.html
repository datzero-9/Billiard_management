<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hệ thống quản lý quán bida hiện đại" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Bida Manager - Quản lý quán bida</title>
    <style>
      body { margin: 0; background: #f0f7ff; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
        background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 30%, #e0e7ff 60%, #ede9fe 100%);
        transition: opacity 0.3s;
      }
      #splash .logo {
        width: 56px; height: 56px; border-radius: 14px;
        background: linear-gradient(135deg, #38bdf8, #3b82f6);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(56,189,248,0.25);
      }
      #splash .logo svg { width: 28px; height: 28px; }
      #splash .text { font-family: system-ui, sans-serif; font-size: 14px; color: #64748b; }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #e2e8f0; overflow: hidden; }
      #splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #38bdf8, #3b82f6);
        animation: slide 1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="3" />
        </svg>
      </div>
      <div class="text">Đang tải...</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 300); }
      });
    </script>
  </body>
</html>
